name: Diagnose release API 403 (temporary)

on:
  push:
    branches: [ccr-4c1a03a1-ysmc95]
    paths: [".github/workflows/diagnose-release-403.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Probe GitHub API
        run: |
          probe() {
            local label="$1" url="$2"; shift 2
            echo "::group::${label} ${url}"
            curl -sS -D - -o body.json -w 'HTTP %{http_code}\n' \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: vibepod-agents-auto-release" "$@" "$url" \
              | grep -iE '^(HTTP|x-ratelimit|x-github-sso|x-accepted|retry-after|x-github-request-id)' || true
            head -c 1500 body.json; echo
            echo "::endgroup::"
          }
          auth=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
          for repo in mistralai/mistral-vibe anthropics/claude-code 1jehuang/jcode; do
            probe "AUTH" "https://api.github.com/repos/${repo}/releases/latest" "${auth[@]}"
            probe "ANON" "https://api.github.com/repos/${repo}/releases/latest"
          done
          probe "AUTH" "https://api.github.com/repos/mistralai/mistral-vibe" "${auth[@]}"
          probe "AUTH" "https://api.github.com/repos/mistralai/mistral-vibe/releases?per_page=1" "${auth[@]}"
          probe "AUTH" "https://api.github.com/repos/mistralai/mistral-vibe/tags?per_page=1" "${auth[@]}"
          probe "AUTH" "https://api.github.com/rate_limit" "${auth[@]}"
          echo "::group::git ls-remote"
          git ls-remote --tags https://github.com/mistralai/mistral-vibe | tail -3
          echo "::endgroup::"
